name: PR Validation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

env:
  BRANCH_REGEX: "^(feature|fix|hotfix|chore|release|docs|refactor|test)\\/[a-z0-9._-]+$"
  COMMIT_REGEX: "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9._-]+\\))?!?: .+"

jobs:
  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch naming
        shell: bash
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Checking branch: ${BRANCH_NAME}"
          if [[ ! "${BRANCH_NAME}" =~ ${BRANCH_REGEX} ]]; then
            echo "Branch name '${BRANCH_NAME}' does not match '${BRANCH_REGEX}'"
            exit 1
          fi

  validate-commit-format:
    name: Validate commit format
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit messages in PR
        uses: actions/github-script@v7
        with:
          script: |
            const regex = new RegExp(process.env.COMMIT_REGEX);
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number,
              per_page: 100
            });
            const invalid = commits.filter(c => !regex.test(c.commit.message.split('\n')[0]));
            if (invalid.length > 0) {
              core.error(`Commit format validation failed. Required pattern: ${process.env.COMMIT_REGEX}`);
              invalid.forEach(c => core.error(`- ${c.sha.substring(0, 7)}: ${c.commit.message.split('\n')[0]}`));
              core.setFailed('Invalid commit messages found in PR.');
            }

  test-and-build:
    name: Run tests and build
    runs-on: ubuntu-latest
    needs: [validate-branch-name, validate-commit-format]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test

      - name: Build project
        run: ./mvnw -B -DskipTests package

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test-and-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t practica:${{ github.sha }} .

      - name: Show image size
        run: docker images practica:${{ github.sha }} --format "{{.Repository}}:{{.Tag}} - {{.Size}}"
